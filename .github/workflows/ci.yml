name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: 0
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo check --locked -p sim-wasm --target wasm32-unknown-unknown
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m unittest discover -s tools -p "test_*.py" -v
  windows-regression:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Frozen 10000-tick regression
        shell: powershell
        run: ./tools/verify_phase0733.ps1
      - name: Twelve 1000-tick intervention runs
        shell: powershell
        run: ./tools/run_phase0759.ps1 -Ticks 1000 -Interval 100 -OutputDirectory results/ci-smoke
      - name: Save compact experiment evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: experiment-evidence
          retention-days: 7
          if-no-files-found: warn
          path: |
            results/ci-smoke/*.metadata.json
            results/ci-smoke/quality.json
            results/ci-smoke/paired_*.csv
