[package]
name = "sim-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
state-audit = ["dep:bincode"]

[dependencies]
bincode = { version = "1.3.3", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# These runners use the audited state API; build them with `--features state-audit`.
[[example]]
name = "stage4_herbivore_learning"
required-features = ["state-audit"]

[[example]]
name = "stage4_integrated_baseline"
required-features = ["state-audit"]

[[example]]
name = "stage5_predator_color"
required-features = ["state-audit"]
